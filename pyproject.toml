# SPDX-License-Identifier: GPL-2.0-or-later
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liblore"
version = "0.7.1"
description = "Shared library for public-inbox / lore.kernel.org access"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSES/*.txt"]
authors = [
    { name = "Konstantin Ryabitsev", email = "konstantin@linuxfoundation.org" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Email",
    "Topic :: Communications :: Email :: Mailing List Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
auth = ["authheaders>=0.15"]

[project.urls]
Homepage = "https://git.kernel.org/pub/scm/utils/liblore/liblore.git"
Repository = "https://git.kernel.org/pub/scm/utils/liblore/liblore.git"

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-requests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "authheaders"
ignore_missing_imports = true

[tool.ruff.lint]
extend-select = ["I"]
